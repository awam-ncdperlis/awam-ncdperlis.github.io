<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk - Pelaporan Bengkel Insight at Workplace</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --primary: #2563eb; 
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9; 
      --card-bg: #ffffff; 
      --text-main: #0f172a; 
      --text-sub: #64748b;
      --border: #e2e8f0; 
    }
    
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body { 
      background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
      color: var(--text-main); 
      margin: 0; 
      padding: 20px 12px; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
    }

    .login-card { 
      width: 100%; 
      max-width: 420px; 
      background: var(--card-bg); 
      border-radius: 20px; 
      padding: 24px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    
    /* LOGO & HEADER */
    .brand-header {
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 12px;
    }
    .brand-logo { 
      height: 48px; 
      width: auto; 
      object-fit: contain; 
    }
    .header-text {
      text-align: center;
    }
    .header-text .title-main {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: #1e293b;
      margin: 0;
    }
    .header-text .title-sub {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      margin: 2px 0;
    }

    .login-title {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }
    .login-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    /* FORM ELEMENTS */
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.88rem; color: #334155; }
    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 13px 16px; 
      border: 1.5px solid var(--border); 
      border-radius: 12px; 
      font-size: 0.95rem; 
      background: #f8fafc;
      transition: all 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* BUTTONS */
    button { 
      width: 100%;
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 15px; 
      border-radius: 12px; 
      font-size: 1rem; 
      cursor: pointer; 
      font-weight: 700; 
      transition: all 0.2s;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    button:hover { 
      background: var(--primary-hover); 
      transform: translateY(-2px); 
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    /* MODAL NOTIFIKASI */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 24px; border-radius: 16px; max-width: 360px; width: 90%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .modal-content h3 { margin-top: 0; color: #dc2626; font-size: 1.1rem; }
    .modal-actions { margin-top: 18px; display: flex; justify-content: center; }
    .modal-actions button { width: auto; padding: 10px 24px; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="login-card">
  
  <!-- HEADER LOGO & LETTERHEAD -->
  <div class="brand-header">
    <div class="logo-container">
      <img src="../images/jata-malaysia.png" alt="Jata Malaysia" class="brand-logo">
      <img src="../images/logo-jata-perlis.png" alt="Logo Negeri Perlis" class="brand-logo">
    </div>
    <div class="header-text">
      <p class="title-main">Kementerian Kesihatan Malaysia</p>
      <p class="title-sub">Jabatan Kesihatan Negeri Perlis</p>
    </div>
  </div>

  <div class="login-title">Portal Pelaporan Bengkel</div>
  <div class="login-subtitle">Akses Khas Untuk Urus Setia & Pentadbir</div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Kata Laluan</label>
      <input type="password" id="password" placeholder="Masukkan kata laluan" required autocomplete="current-password">
    </div>
    <button type="submit" id="btnLogin">Log Masuk</button>
  </form>

</div>

<!-- MODAL NOTIFIKASI -->
<div class="modal-overlay" id="customModal">
  <div class="modal-content">
    <h3 id="modalTitle">Notifikasi</h3>
    <div id="modalMessage" style="color: var(--text-sub); font-size: 0.9rem; line-height: 1.5;"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
  // SCRIPT URL UNTUK BACKEND PELAPORAN
  const REPORTING_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqcLMFHHPHYoB1P_TvTQLg1HMjKDGxM1RJlZIp2RdlOSaZMOOKgFga8wFyAZMQsOyDgg/exec';

  // SEMAK JIKA PENGGUNA SUDAH LOG MASUK SEBELUM INI
  window.onload = function() {
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'dashboard.html';
    }
  };

  function showModal(title, msgHtml, actionsHtml) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerHTML = msgHtml;
    document.getElementById('modalActions').innerHTML = actionsHtml;
    document.getElementById('customModal').style.display = 'flex';
  }

  function closeModal() { document.getElementById('customModal').style.display = 'none'; }

  async function handleLogin(event) {
    event.preventDefault();
    
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var btn = document.getElementById('btnLogin');

    if (!u || !p) {
      showModal('Ralat', 'Sila isi Username dan Kata Laluan.', '<button onclick="closeModal()">Tutup</button>');
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Disahkan...';
    showModal('Pengesahan', 'Sedang mengesahkan akaun anda...', '');

    try {
      let response = await fetch(`${REPORTING_SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
      let res = await response.json();
      closeModal();

      if (res.status === 'SUCCESS') {
        // SIMPAN CREDENTIALS DALAM SESSION STORAGE
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('userNama', res.user.nama);
        sessionStorage.setItem('userPeranan', res.user.peranan);
        sessionStorage.setItem('username', res.user.username);

        // LENCONGKAN TERUS KE DASHBOARD.HTML
        window.location.href = 'dashboard.html';
      } else {
        btn.disabled = false;
        btn.innerText = 'Log Masuk';
        showModal('Gagal Log Masuk', res.message || 'Username atau Password salah.', '<button onclick="closeModal()">Cuba Lagi</button>');
      }
    } catch (err) {
      closeModal();
      btn.disabled = false;
      btn.innerText = 'Log Masuk';
      showModal('Ralat', 'Gagal berhubung dengan pelayan. Sila cuba lagi.', '<button onclick="closeModal()">Tutup</button>');
    }
  }
</script>
</body>
</html>
