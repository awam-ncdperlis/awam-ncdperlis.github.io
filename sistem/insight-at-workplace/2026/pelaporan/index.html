<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pelaporan Bengkel</title>
  <style>
    :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --border: #dadce0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h2 { color: var(--primary); margin-bottom: 20px; }
    .filter-card { background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.95rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; border-left: 5px solid var(--primary); }
    .stat-card h3 { margin: 0; font-size: 1.8rem; color: #202124; }
    .stat-card p { margin: 5px 0 0 0; color: #5f6368; font-size: 0.85rem; }
    table { width: 100%; background: white; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: #f1f3f4; color: #3c4043; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .badge-success { background: #e6f4ea; color: #137333; }
    .badge-warning { background: #fef7e0; color: #b06000; }
  </style>
</head>
<body>

<div class="container">
  <h2>Dashboard Pelaporan Bengkel</h2>

  <div class="filter-card">
    <div class="filter-group">
      <label><strong>Tahun:</strong></label>
      <select id="filterYear" onchange="loadDashboard()"><option value="">Semua Tahun</option></select>
    </div>
    <div class="filter-group">
      <label><strong>Tarikh Bengkel:</strong></label>
      <select id="filterDate" onchange="loadDashboard()"><option value="">Semua Tarikh</option></select>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><h3 id="statTotal">0</h3><p>Jumlah Peserta</p></div>
    <div class="stat-card"><h3 id="statPre">0</h3><p>Purata Skor Pre-Test</p></div>
    <div class="stat-card"><h3 id="statPost">0</h3><p>Purata Skor Post-Test</p></div>
    <div class="stat-card"><h3 id="statGain">0</h3><p>Purata Peningkatan</p></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nama Peserta</th>
        <th>No. IC</th>
        <th>Jabatan</th>
        <th>Pre-Test</th>
        <th>Post-Test</th>
        <th>Peningkatan</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="participantTable">
      <tr><td colspan="7" style="text-align:center;">Memuatkan data...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZWAaTNKmzkO3L8ebCW5JWcSmPtgi9Mt0EGd9733cWZB9jMRCHXSyNgj2uQxhlU1yP/exec';

  async function loadDashboard() {
    var year = document.getElementById('filterYear').value;
    var date = document.getElementById('filterDate').value;

    try {
      let response = await fetch(`${SCRIPT_URL}?action=getDashboardData&year=${year}&date=${date}`);
      let res = await response.json();

      if (res.status === 'SUCCESS') {
        var yearSelect = document.getElementById('filterYear');
        var dateSelect = document.getElementById('filterDate');

        if (yearSelect.options.length === 1) {
          res.years.forEach(y => { yearSelect.add(new Option(y, y)); });
        }
        if (dateSelect.options.length === 1) {
          res.dates.forEach(d => { dateSelect.add(new Option(d, d)); });
        }

        document.getElementById('statTotal').innerText = res.summary.totalParticipants;
        document.getElementById('statPre').innerText = res.summary.avgPreScore + ' / 20';
        document.getElementById('statPost').innerText = res.summary.avgPostScore + ' / 20';
        
        var gainVal = res.summary.avgGain;
        document.getElementById('statGain').innerText = (gainVal >= 0 ? '+' : '') + gainVal;

        var html = '';
        if (res.participants.length === 0) {
          html = '<tr><td colspan="7" style="text-align:center;">Tiada rekod dijumpai.</td></tr>';
        } else {
          res.participants.forEach(p => {
            var preText = p.preScore !== null ? `${p.preScore}/20` : '-';
            var postText = p.postScore !== null ? `${p.postScore}/20` : '-';
            var diffText = '-';
            var statusBadge = '<span class="badge badge-warning">Pre-Test Sahaja</span>';

            if (p.preScore !== null && p.postScore !== null) {
              var diff = p.postScore - p.preScore;
              diffText = (diff >= 0 ? `+${diff}` : `${diff}`);
              statusBadge = '<span class="badge badge-success">Lengkap</span>';
            }

            html += `
              <tr>
                <td><strong>${p.nama}</strong></td>
                <td>${p.ic}</td>
                <td>${p.jabatan}</td>
                <td>${preText}</td>
                <td>${postText}</td>
                <td><strong>${diffText}</strong></td>
                <td>${statusBadge}</td>
              </tr>
            `;
          });
        }
        document.getElementById('participantTable').innerHTML = html;
      }
    } catch (e) {
      console.error(e);
      document.getElementById('participantTable').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Gagal memuatkan data pelayan. Sila pastikan Apps Script telah di-deploy dengan akses "Anyone".</td></tr>';
    }
  }

  loadDashboard();
</script>
</body>
</html>
