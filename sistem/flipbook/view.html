<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembaca Flipbook Digital HD</title>
    <link rel="icon" type="image/png" href="../../favicon/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .page { background-color: #fff; box-shadow: 0 0 12px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col justify-between">

    <!-- Top Action Bar -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <a href="index.html" class="text-slate-300 hover:text-white font-medium text-xs md:text-sm flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Kembali ke Katalog</span>
        </a>
        <h1 id="readerTitle" class="text-sm md:text-base font-bold truncate max-w-xs md:max-w-md">Memuatkan...</h1>
        <div class="flex gap-2">
            <button id="fullscreenBtn" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs transition">
                <i class="fa-solid fa-expand"></i> <span class="hidden md:inline">Fullscreen</span>
            </button>
            <button onclick="openShareModal()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-xs font-semibold transition">
                <i class="fa-solid fa-share-nodes"></i> <span class="hidden md:inline">Kongsi</span>
            </button>
        </div>
    </header>

    <!-- Flipbook Canvas Wrapper -->
    <main id="flipbookWrapper" class="flex-1 flex flex-col justify-center items-center p-4 relative overflow-hidden min-h-[500px]">
        <div id="loader" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-500"></i>
            <p id="loaderStatus" class="mt-3 text-slate-400 text-sm">Menyiapkan helaian flipbook...</p>
        </div>
        <div id="flipbookContainer"></div>
    </main>

    <!-- Bottom Navigation Bar -->
    <footer id="navControlBar" class="bg-slate-800 border-t border-slate-700 px-4 py-3 flex flex-wrap justify-center items-center gap-3 md:gap-6 z-40">
        <!-- Ke Muka Surat Pertama -->
        <button onclick="goToFirstPage()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-xs transition" title="Muka Pertama">
            <i class="fa-solid fa-backward-step"></i>
        </button>

        <!-- Ke Muka Surat Sebelum -->
        <button onclick="goToPrevPage()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-xs transition flex items-center gap-1" title="Sebelum">
            <i class="fa-solid fa-chevron-left"></i> <span class="hidden sm:inline">Sebelum</span>
        </button>

        <!-- Penunjuk & Lompat Muka Surat -->
        <div class="flex items-center gap-2 text-xs text-slate-300">
            <span>Muka Surat</span>
            <input type="number" id="pageJumpInput" min="1" value="1" onkeypress="handlePageJump(event)" class="w-12 bg-slate-900 border border-slate-600 text-white text-center rounded px-1 py-1 text-xs outline-none focus:ring-1 focus:ring-indigo-500">
            <span id="totalPagesText">dari 0</span>
        </div>

        <!-- Ke Muka Surat Selepas -->
        <button onclick="goToNextPage()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-xs transition flex items-center gap-1" title="Selepas">
            <span class="hidden sm:inline">Selepas</span> <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Ke Muka Surat Terakhir -->
        <button onclick="goToLastPage()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-xs transition" title="Muka Terakhir">
            <i class="fa-solid fa-forward-step"></i>
        </button>
    </footer>

    <!-- Modal Perkongsian -->
    <div id="shareModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-white text-slate-800 rounded-xl p-6 max-w-sm w-full relative text-center space-y-4">
            <button onclick="closeShareModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-lg font-bold">Perkongsian Flipbook</h3>
            <div id="qrcode" class="flex justify-center my-2"></div>
            <div class="flex gap-2">
                <input type="text" id="shareUrlInput" readonly class="border rounded p-2 text-xs w-full bg-slate-50">
                <button onclick="copyShareUrl()" class="bg-indigo-600 text-white px-3 py-2 rounded hover:bg-indigo-700 text-xs font-medium">
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx4ce1p-VyQuD5rnaT4dccmxTVLEkfmyjBikHgtmsDI9SqRx2f5GqUuhJi9rutOb424_g/exec";
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let currentFlipbook = null;
        let pageFlipInstance = null;
        let totalPages = 0;

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('id');

            if (!bookId) {
                alert("ID Flipbook tidak dijumpai.");
                window.location.href = 'index.html';
                return;
            }

            await loadFlipbook(bookId);
        };

        async function loadFlipbook(id) {
            try {
                const res = await fetch(`${API_URL}?action=getFlipbooks`);
                const json = await res.json();
                
                if (json.status === 'success') {
                    currentFlipbook = json.data.find(f => f.id === id);
                    if (!currentFlipbook) throw new Error("Flipbook tidak wujud.");

                    document.getElementById('readerTitle').innerText = currentFlipbook.title;
                    await renderPDF(currentFlipbook.pdfUrl);
                }
            } catch (err) {
                document.getElementById('loader').innerHTML = `<p class="text-red-400">${err.message || 'Gagal memuatkan dokumen.'}</p>`;
            }
        }

        async function renderPDF(pdfUrl) {
            try {
                document.getElementById('loaderStatus').innerText = "Mengambil data PDF dari Google Drive...";

                const res = await fetch(`${API_URL}?action=getPdfBase64&url=${encodeURIComponent(pdfUrl)}`);
                const json = await res.json();

                if (json.status !== 'success' || !json.base64) {
                    throw new Error(json.message || "Gagal mengambil data PDF");
                }

                const rawData = atob(json.base64);
                const bytes = new Uint8Array(rawData.length);
                for (let i = 0; i < rawData.length; i++) {
                    bytes[i] = rawData.charCodeAt(i);
                }

                document.getElementById('loaderStatus').innerText = "Menjana helaian selakan resolusi tinggi...";

                const loadingTask = pdfjsLib.getDocument({ data: bytes });
                const pdf = await loadingTask.promise;
                totalPages = pdf.numPages;

                document.getElementById('totalPagesText').innerText = `dari ${totalPages}`;
                document.getElementById('pageJumpInput').max = totalPages;

                document.getElementById('loader').classList.add('hidden');
                const container = document.getElementById('flipbookContainer');

                if (pageFlipInstance) pageFlipInstance.destroy();

                pageFlipInstance = new St.PageFlip(container, {
                    width: 450,
                    height: 630,
                    showCover: true,
                    mobileScrollSupport: false
                });

                const pagesArr = [];
                // PENINGKATAN RESOLUSI TAJAM (HIGH QUALITY RENDERING)
                const renderScale = 1.8; 

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: renderScale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const div = document.createElement('div');
                    div.className = 'page';
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/jpeg', 0.95);
                    img.style.width = '100%';
                    img.style.height = '100%';
                    div.appendChild(img);
                    
                    pagesArr.push(div);
                }

                pageFlipInstance.loadFromHTML(pagesArr);

                // Event listener apabila muka surat bertukar
                pageFlipInstance.on('flip', (e) => {
                    const currentPageIndex = e.data + 1; // 1-based index
                    document.getElementById('pageJumpInput').value = currentPageIndex;
                });

            } catch (err) {
                document.getElementById('loader').classList.remove('hidden');
                document.getElementById('loader').innerHTML = `<p class="text-red-400">Ralat memproses PDF: ${err.message}</p>`;
            }
        }

        // FUNGSI NAVIGASI BUTTON
        function goToNextPage() {
            if (pageFlipInstance) pageFlipInstance.flipNext();
        }

        function goToPrevPage() {
            if (pageFlipInstance) pageFlipInstance.flipPrev();
        }

        function goToFirstPage() {
            if (pageFlipInstance) pageFlipInstance.flip(0);
        }

        function goToLastPage() {
            if (pageFlipInstance && totalPages > 0) pageFlipInstance.flip(totalPages - 1);
        }

        function handlePageJump(e) {
            if (e.key === 'Enter') {
                let pageNum = parseInt(e.target.value);
                if (isNaN(pageNum) || pageNum < 1) pageNum = 1;
                if (pageNum > totalPages) pageNum = totalPages;

                if (pageFlipInstance) {
                    pageFlipInstance.flip(pageNum - 1);
                }
            }
        }

        // FULLSCREEN & SHARE MODAL
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const elem = document.getElementById('flipbookWrapper');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        });

        function openShareModal() {
            const shareUrl = window.location.href;
            document.getElementById('shareUrlInput').value = shareUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, { text: shareUrl, width: 128, height: 128 });

            document.getElementById('shareModal').classList.remove('hidden');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
        }

        function copyShareUrl() {
            const input = document.getElementById('shareUrlInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("Pautan telah disalin!");
        }
    </script>
</body>
</html>
