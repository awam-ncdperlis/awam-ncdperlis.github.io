<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Flipbook Digital - Awam</title>
    <link rel="icon" type="image/png" href="../../favicon/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> Portal Flipbook Digital
            </a>
            <div>
                <a href="login.html" class="bg-indigo-600 hover:bg-indigo-800 px-4 py-2 rounded-lg text-sm transition">
                    <i class="fa-solid fa-user-lock"></i> Admin Log Masuk
                </a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-slate-700">Katalog Flipbook Digital</h2>
                <p class="text-slate-500 text-sm">Pilih dan baca dokumen secara interaktif</p>
            </div>
            <!-- Search & Filter -->
            <div class="flex gap-2 w-full md:w-auto">
                <input type="text" id="searchInput" onkeyup="filterFlipbooks()" placeholder="Cari tajuk..." class="border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 w-full md:w-64">
            </div>
        </div>

        <div id="loader" class="text-center py-12">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600"></i>
            <p class="mt-2 text-slate-500 text-sm">Memuatkan katalog...</p>
        </div>

        <div id="flipbookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden"></div>
    </main>

    <footer class="bg-white border-t mt-auto py-4 text-center text-xs text-slate-500">
        &copy; 2026 Portal Flipbook Digital. Hak Cipta Terelihara.
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx4ce1p-VyQuD5rnaT4dccmxTVLEkfmyjBikHgtmsDI9SqRx2f5GqUuhJi9rutOb424_g/exec";
        let flipbooksData = [];

        window.onload = async () => {
            await fetchFlipbooks();
        };

        async function fetchFlipbooks() {
            try {
                const res = await fetch(`${API_URL}?action=getFlipbooks`);
                const json = await res.json();
                document.getElementById('loader').classList.add('hidden');

                if (json.status === 'success') {
                    flipbooksData = json.data;
                    document.getElementById('flipbookGrid').classList.remove('hidden');
                    renderCards(flipbooksData);
                }
            } catch (err) {
                document.getElementById('loader').innerHTML = `<p class="text-red-500">Gagal memuatkan data dari pangkalan data.</p>`;
                console.error(err);
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('flipbookGrid');
            if (!items || items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">Tiada flipbook ditemui.</p>`;
                return;
            }
            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden flex flex-col border border-slate-100">
                    <img src="${item.coverUrl}" class="h-52 w-full object-cover" alt="Cover" onerror="this.src='https://via.placeholder.com/300x400?text=No+Cover'">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-semibold">${item.category || 'Umum'}</span>
                            <h3 class="font-bold text-lg mt-2 text-slate-800 line-clamp-1">${item.title}</h3>
                            <p class="text-slate-500 text-xs line-clamp-2 mt-1">${item.description || 'Tiada penerangan.'}</p>
                        </div>
                        <a href="view.html?id=${item.id}" class="mt-4 w-full bg-indigo-600 text-white text-center py-2 rounded-lg font-medium hover:bg-indigo-700 transition block text-sm">
                            <i class="fa-solid fa-book-open"></i> Baca Flipbook
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterFlipbooks() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = flipbooksData.filter(item => item.title.toLowerCase().includes(q) || item.category.toLowerCase().includes(q));
            renderCards(filtered);
        }
    </script>
</body>
</html>
