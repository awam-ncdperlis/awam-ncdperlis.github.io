<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Flipbook (CRUD Admin)</title>
    <link rel="icon" type="image/png" href="../../favicon/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Admin Nav -->
    <nav class="bg-slate-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="font-bold flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-400"></i> Dashboard Pengurusan Admin
            </span>
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded">
                    <i class="fa-solid fa-external-link"></i> Lihat Web Awam
                </a>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-2 rounded">
                    <i class="fa-solid fa-right-from-bracket"></i> Log Keluar
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Admin Dashboard -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-slate-700">Pengurusan Flipbook (CRUD)</h2>
                <p class="text-xs text-slate-500">Tambah, lihat, edit, padam dan dapatkan pautan direct fail.</p>
            </div>
            <button onclick="openFormModal('create')" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded-lg font-medium shadow flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Tambah Flipbook Baru
            </button>
        </div>

        <div id="loader" class="text-center py-12">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600"></i>
            <p class="mt-2 text-slate-500 text-sm">Memuatkan rekod...</p>
        </div>

        <!-- Table CRUD -->
        <div id="tableWrapper" class="bg-white rounded-xl shadow overflow-hidden hidden border">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-xs">
                        <tr>
                            <th class="p-4">Cover</th>
                            <th class="p-4">Tajuk / Kategori</th>
                            <th class="p-4">Penerangan</th>
                            <th class="p-4 text-center">Pautan Awam</th>
                            <th class="p-4 text-center">Tindakan (CRUD)</th>
                        </tr>
                    </thead>
                    <tbody id="crudTableBody" class="divide-y text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL FORM (CREATE / EDIT) -->
    <div id="formModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-lg w-full relative">
            <button onclick="closeModal('formModal')" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="modalTitle" class="text-xl font-bold mb-4 text-slate-700">Tambah Flipbook</h3>
            
            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="formId">
                <div>
                    <label class="block text-xs font-semibold mb-1">Tajuk Flipbook</label>
                    <input type="text" id="formTitle" required class="w-full border rounded p-2 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Kategori</label>
                    <input type="text" id="formCategory" placeholder="cth: Majalah, Katalog" required class="w-full border rounded p-2 text-sm outline-none">
                </div>
                
                <!-- Ruangan Muat Naik Fail -->
                <div id="fileUploadGroup">
                    <label class="block text-xs font-semibold mb-1">Pilih Fail PDF Baru</label>
                    <input type="file" id="formPdfFile" accept="application/pdf" class="w-full border rounded p-2 text-xs">
                    
                    <label class="block text-xs font-semibold mt-3 mb-1">Pilih Imej Cover Baru</label>
                    <input type="file" id="formCoverFile" accept="image/*" class="w-full border rounded p-2 text-xs">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1">Penerangan Ringkas</label>
                    <textarea id="formDesc" rows="3" class="w-full border rounded p-2 text-sm outline-none"></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded font-semibold hover:bg-indigo-700 transition text-sm">
                    Simpan Rekod
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx4ce1p-VyQuD5rnaT4dccmxTVLEkfmyjBikHgtmsDI9SqRx2f5GqUuhJi9rutOb424_g/exec";
        let flipbooksData = [];
        let formMode = 'create';

        // Semak Sesi Admin
        window.onload = () => {
            if (sessionStorage.getItem('adminSession') !== 'true') {
                alert("Sila log masuk terlebih dahulu!");
                window.location.href = 'login.html';
                return;
            }
            loadData();
        };

        function logout() {
            sessionStorage.removeItem('adminSession');
            window.location.href = 'login.html';
        }

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}?action=getFlipbooks`);
                const json = await res.json();
                document.getElementById('loader').classList.add('hidden');
                
                if (json.status === 'success') {
                    flipbooksData = json.data;
                    document.getElementById('tableWrapper').classList.remove('hidden');
                    renderTable();
                }
            } catch (err) {
                alert("Gagal memuatkan rekod.");
            }
        }

        function renderTable() {
            const tbody = document.getElementById('crudTableBody');
            if (flipbooksData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Tiada rekod flipbook.</td></tr>`;
                return;
            }

            tbody.innerHTML = flipbooksData.map(item => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4">
                        <img src="${item.coverUrl}" class="w-12 h-16 object-cover rounded shadow-sm" onerror="this.src='https://via.placeholder.com/100'">
                    </td>
                    <td class="p-4">
                        <div class="font-bold text-slate-800">${item.title}</div>
                        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold">${item.category}</span>
                    </td>
                    <td class="p-4 text-xs text-slate-500 max-w-xs truncate">${item.description}</td>
                    
                    <!-- LINK DIRECT FLIPBOOK -->
                    <td class="p-4 text-center">
                        <a href="view.html?id=${item.id}" target="_blank" class="inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-full text-xs font-semibold border border-indigo-200">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Link
                        </a>
                    </td>

                    <!-- TINDAKAN CRUD -->
                    <td class="p-4 text-center space-x-1">
                        <button onclick="openFormModal('edit', '${item.id}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded transition" title="Kemaskini">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteFlipbook('${item.id}')" class="text-red-600 hover:bg-red-50 p-2 rounded transition" title="Padam">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function openFormModal(mode, id = null) {
            formMode = mode;
            document.getElementById('formId').value = id || '';
            document.getElementById('modalTitle').innerText = mode === 'create' ? 'Tambah Flipbook Baru' : 'Kemaskini Flipbook';

            if (mode === 'edit') {
                const item = flipbooksData.find(f => f.id === id);
                document.getElementById('formTitle').value = item.title;
                document.getElementById('formCategory').value = item.category;
                document.getElementById('formDesc').value = item.description;
                document.getElementById('formPdfFile').required = false;
                document.getElementById('formCoverFile').required = false;
            } else {
                document.getElementById('formTitle').value = '';
                document.getElementById('formCategory').value = '';
                document.getElementById('formDesc').value = '';
                document.getElementById('formPdfFile').required = true;
                document.getElementById('formCoverFile').required = true;
            }

            document.getElementById('formModal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            try {
                const pdfInput = document.getElementById('formPdfFile').files[0];
                const coverInput = document.getElementById('formCoverFile').files[0];

                const payload = {
                    action: formMode === 'create' ? 'addFlipbook' : 'updateFlipbook',
                    id: document.getElementById('formId').value,
                    title: document.getElementById('formTitle').value,
                    category: document.getElementById('formCategory').value,
                    description: document.getElementById('formDesc').value
                };

                if (pdfInput) {
                    payload.pdfFile = {
                        name: pdfInput.name,
                        mimeType: pdfInput.type,
                        bytes: await fileToBase64(pdfInput)
                    };
                }

                if (coverInput) {
                    payload.coverFile = {
                        name: coverInput.name,
                        mimeType: coverInput.type,
                        bytes: await fileToBase64(coverInput)
                    };
                }

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const json = await res.json();
                if (json.status === 'success') {
                    alert(json.message);
                    closeModal('formModal');
                    loadData();
                } else {
                    alert("Ralat: " + json.message);
                }
            } catch (err) {
                alert("Gagal memproses permintaan.");
            } finally {
                btn.innerText = "Simpan Rekod";
                btn.disabled = false;
            }
        }

        async function deleteFlipbook(id) {
            if (!confirm("Adakah anda pasti mahu memadam rekod ini?")) return;
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'deleteFlipbook', id })
                });
                const json = await res.json();
                if (json.status === 'success') {
                    alert("Rekod berjaya dipadam!");
                    loadData();
                }
            } catch (err) {
                alert("Gagal memadam rekod.");
            }
        }
    </script>
</body>
</html>
