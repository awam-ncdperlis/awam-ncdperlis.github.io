<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk Admin - Flipbook</title>
    <link rel="icon" type="image/png" href="../../favicon/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Log Masuk Admin</h2>
            <p class="text-slate-500 text-sm">Sistem Pengurusan Flipbook Digital</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Pengguna</label>
                <input type="text" id="adminUser" required class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Kata Laluan</label>
                <input type="password" id="adminPass" required class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
                Log Masuk
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="index.html" class="text-xs text-indigo-600 hover:underline"><i class="fa-solid fa-arrow-left"></i> Kembali ke Katalog Awam</a>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx4ce1p-VyQuD5rnaT4dccmxTVLEkfmyjBikHgtmsDI9SqRx2f5GqUuhJi9rutOb424_g/exec";

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Mengesahkan...";
            btn.disabled = true;

            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', username, password })
                });
                const json = await res.json();

                if (json.status === 'success') {
                    sessionStorage.setItem('adminSession', 'true');
                    window.location.href = 'manage.html';
                } else {
                    alert(json.message);
                }
            } catch (err) {
                alert("Gagal menyambung ke server log masuk.");
            } finally {
                btn.innerText = "Log Masuk";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
